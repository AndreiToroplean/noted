<mat-dialog-content>Throw away what you typed?</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">Keep editing</button>
  <!-- Focused first, so Esc then Enter is the quick way out. -->
  <button mat-flat-button [mat-dialog-close]="true" cdkFocusInitial data-discard>Discard</button>
</mat-dialog-actions>
