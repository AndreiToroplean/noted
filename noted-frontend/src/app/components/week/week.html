<!-- One drop group, so an item can be dragged from one day into another. -->
<div class="flex h-full w-full gap-2" cdkDropListGroup>
  @for (day of visibleDays(); track day.date; let index = $index) {
    <app-day
      [day]="day"
      [previousDate]="dateAt(index - 1)"
      [nextDate]="dateAt(index + 1)"
      class="min-w-0 flex-1"
    />
  }
</div>
