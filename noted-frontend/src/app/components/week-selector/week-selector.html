<p-tabs
  [value]="(appData.selectedWeek() | date: 'yyyy-MM-dd') || ''"
  (valueChange)="setSelectedWeek($event)"
>
  <p-tablist>
    @for (week of appData.weeks(); track week) {
      <p-tab [value]="(week | date: 'yyyy-MM-dd') || ''"> {{ week | date: 'dd/MM/yyyy' }} </p-tab>
    }
  </p-tablist>
</p-tabs>
