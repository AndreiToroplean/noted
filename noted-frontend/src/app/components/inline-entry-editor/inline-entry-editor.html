<textarea
  #textField
  class="inline-field"
  rows="1"
  aria-label="Entry"
  data-edit-text
  [readOnly]="busy()"
  [value]="text()"
  (input)="onInput('text', textField.value)"
  (keydown)="onTextKeydown($event)"
></textarea>
@if (note() !== null) {
  <textarea
    #noteField
    class="inline-field text-xs opacity-60"
    rows="1"
    aria-label="Note"
    placeholder="Note"
    data-edit-note
    [readOnly]="busy()"
    [value]="note()"
    (input)="onInput('note', noteField.value)"
    (keydown)="onKeydown($event)"
  ></textarea>
}
@if (error(); as message) {
  <div class="editor-hint editor-hint-error" role="alert">{{ message }}</div>
} @else {
  <div class="editor-hint" role="note">Enter for a note · Ctrl+Enter to save · Esc to close</div>
}
