<textarea
  #field
  class="inline-field"
  rows="1"
  aria-label="Entry"
  [placeholder]="adding() ? '[T] project: what was done' : ''"
  data-edit-text
  [readOnly]="busy()"
  [value]="content()"
  (input)="onInput(field.value)"
  (keydown)="onKeydown($event)"
></textarea>
@if (error(); as message) {
  <div class="editor-hint editor-hint-error" role="alert">{{ message }}</div>
} @else {
  <div class="editor-hint" role="note">
    @if (adding()) {
      Enter to add · Ctrl+Enter for a new line · Ctrl+B for a break · Esc to close
    } @else {
      Enter to save · Ctrl+Enter for a new line · Esc to close
    }
  </div>
}
