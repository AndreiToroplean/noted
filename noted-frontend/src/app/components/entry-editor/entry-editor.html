<div class="entry-editor px-2 py-1">
  <textarea
    #field
    class="entry-editor-field w-full resize-none px-1 text-sm"
    rows="1"
    [value]="text()"
    placeholder="[T] project: what was done"
    [readOnly]="busy()"
    (input)="text.set(field.value)"
    (keydown)="onKeydown($event)"
  ></textarea>
  @if (error(); as message) {
    <div class="entry-editor-error text-xs" role="alert">{{ message }}</div>
  }
  <div class="editor-hint" role="note">Ctrl+Enter to add · Ctrl+B for a break · Esc to close</div>
</div>
