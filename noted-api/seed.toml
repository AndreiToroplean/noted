# The database a new user starts from. Read by `seed.py`.
#
# A `seed-local.toml` beside the database is read instead of this file, whole —
# copy this one and edit it to start from your own hours or your own vocabulary.

# Default hours, one row per weekday, Monday first. Nine to five with an hour
# for lunch, Friday ending at four, the weekend non-working. A weekday left
# empty expects nothing.
[settings.0]
arrival = 09:00:00
break_start = 12:00:00
break_end = 13:00:00
departure = 17:00:00
expected_minutes = 420

[settings.1]
arrival = 09:00:00
break_start = 12:00:00
break_end = 13:00:00
departure = 17:00:00
expected_minutes = 420

[settings.2]
